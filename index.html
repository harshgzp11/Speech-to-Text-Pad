<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text Pad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Speech to Text Pad</h1>

    <div class="controls">
        <button id="startBtn">Start Listening</button>
        <button id="stopBtn">Stop Listening</button>
        <button id="saveBtn">Save Note</button>
    </div>

    <textarea id="textBox" placeholder="Speech will appear here"></textarea>

    <h3>Saved Notes</h3>

    <ul id="notesList"></ul>

    <button id="clearAllBtn" class="clearBtn">Clear All Notes</button>

    <script src="script.js"></script>
</body>
</html>
